name: HSR Windows writer and journal safety

on:
  pull_request:
  push:
    branches: [main]

jobs:
  windows-process-safety:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile job modules
        run: python -m compileall -q app tests
      - name: Two-process writer and journal regression (native Windows)
        run: python -m unittest tests.test_project_writer_lock tests.test_job_journal_multiprocess tests.test_job_tombstone_compaction tests.test_owned_build_mkv_seal -v
