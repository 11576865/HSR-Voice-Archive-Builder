name: HSR subtitle browser evidence

on:
  pull_request:
    paths:
      - "app/static/index.html"
      - "app/static/hsr-ui-convergence.css"
      - "app/project_fonts.py"
      - "tests/test_project_fonts.py"
      - "tests/test_hsr_ui_convergence.py"
      - "tests/test_hsr_touch_workbench.py"
      - "tests/test_hsr_navigation_save_gate.py"
      - "tests/test_hsr_shared_subtitle_corpus.py"
      - "tests/browser_visual_evidence.py"
      - "tests/browser_live_preview_e2e.py"
      - "tests/test_subtitle_integrated_export.py"
      - "app/subtitles.py"
      - "app/subtitle_timing.py"
      - "app/ass_preview.py"
      - "app/archive_bundle_exporter.py"
      - "tests/test_archive_bundle_exporter.py"
      - "app/server.py"
      - "app/lite_server.py"
      - "tests/test_hsr_three_pass_scope.py"
      - "tests/test_hsr_local_footage_preview.py"
      - "tests/test_hsr_preview_background_color.py"
      - ".github/workflows/subtitle-browser-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium automation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements-test.txt
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Render responsive workbench and exercise real drag interactions
        run: python tests/browser_visual_evidence.py --output artifacts/subtitle-browser
      - name: Assert compact UI ownership and syntax contracts
        run: python -m unittest tests.test_hsr_ui_convergence -v
      - name: Verify Review save-gate and duplicate editor write ownership
        run: python -m unittest tests.test_hsr_navigation_save_gate -v
      - name: Verify shared corpus cache isolation, invalidation and TTL
        run: python -m unittest tests.test_hsr_shared_subtitle_corpus -v
      - name: Assert viewport scroll, slider lock, and Karaoke help contracts
        run: python -m unittest tests.test_hsr_touch_workbench -v
      - name: Validate project font upload and genuine libass font-folder raster
        run: python -m unittest tests.test_project_fonts -v
      - name: Real Chromium to FastAPI to libass to VP8/Opus preview (no mock video endpoint)
        run: python tests/browser_live_preview_e2e.py --output artifacts/subtitle-browser
      - name: Upload real browser fixture screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsr-ass-studio-chromium-${{ github.run_id }}
          path: artifacts/subtitle-browser/
          if-no-files-found: warn
          retention-days: 14

  libass-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual FFmpeg with libass and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-test.txt
      - name: Assert ASS raster engine actually exists
        run: |
          command -v ffmpeg
          ffmpeg -hide_banner -filters | grep -E '[[:space:]]ass[[:space:]]'
      - name: Prove generated ASS displays only inside saved time window
        env:
          HSR_LIBASS_EVIDENCE_DIR: artifacts/subtitle-libass
        run: python -m unittest tests.test_subtitle_integrated_export -v
      - name: Verify real H.264 subtitle motion preview and API
        run: python -m unittest tests.test_hsr_three_pass_scope -v
      - name: Verify actual FFmpeg solid-color pixel and API provenance
        run: python -m unittest tests.test_hsr_preview_background_color -v
      - name: Prove genuine local footage plus ASS compositing
        run: python -m unittest tests.test_hsr_local_footage_preview -v
      - name: Prove full MKV selectable ASS, FLAC, fonts and actual image-backed video
        run: python -m unittest tests.test_archive_bundle_exporter -v
      - name: Upload FFmpeg/libass pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsr-ass-libass-frames-${{ github.run_id }}
          path: artifacts/subtitle-libass/
          if-no-files-found: warn
          retention-days: 14
