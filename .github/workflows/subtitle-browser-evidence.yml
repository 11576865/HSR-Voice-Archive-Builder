name: HSR subtitle browser evidence

on:
  pull_request:
    paths:
      - "app/static/index.html"
      - "app/ass_preview.py"
      - "subtitle_layout/rendered_ink.py"
      - "subtitle_layout/temporal_samples.py"
      - "tests/test_rendered_ink_boundary.py"
      - "tests/test_rendered_ink_interval.py"
      - "app/ass_artifact_evidence.py"
      - "app/ass_coverage_batches.py"
      - "app/ass_coverage_lock.py"
      - "tests/test_ass_coverage_writer_lock.py"
      - "tests/test_ass_coverage_batches.py"
      - "app/ass_export_sampling.py"
      - "tests/test_ass_export_sampling_scale.py"
      - "app/jobs.py"
      - "tests/test_jobs_history_pruning.py"
      - "tests/test_jobs_cancel_commit_boundary.py"
      - "tests/test_export_ass_infrastructure.py"
      - "tests/browser_visual_evidence.py"
      - "tests/test_subtitle_integrated_export.py"
      - "app/subtitles.py"
      - "app/subtitle_timing.py"
      - ".github/workflows/subtitle-browser-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium automation
        run: |
          python -m pip install "playwright==1.55.0"
          python -m playwright install --with-deps chromium
      - name: Render responsive workbench and exercise real drag interactions
        run: python tests/browser_visual_evidence.py --output artifacts/subtitle-browser
      - name: Upload real browser fixture screenshots and geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsr-ass-studio-chromium-${{ github.run_id }}
          path: artifacts/subtitle-browser/
          if-no-files-found: warn
          retention-days: 14

  libass-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual FFmpeg with libass and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -r requirements-test.txt
      - name: Assert ASS raster engine actually exists
        run: |
          command -v ffmpeg
          ffmpeg -hide_banner -filters | grep -E '[[:space:]]ass[[:space:]]'
      - name: Prove generated ASS displays only inside saved time window
        env:
          HSR_LIBASS_EVIDENCE_DIR: artifacts/subtitle-libass
          HSR_ASS_SAMPLER_BENCHMARK_DIR: artifacts/subtitle-libass
        run: |
          python -m unittest tests.test_subtitle_integrated_export -v
          python -m unittest tests.test_rendered_ink_boundary -v
          python -m unittest tests.test_rendered_ink_interval -v
          python -m unittest tests.test_export_ass_infrastructure -v
          python -m unittest tests.test_ass_coverage_batches -v
          python -m unittest tests.test_ass_coverage_writer_lock -v
          python -m unittest tests.test_jobs_history_pruning -v
          python -m unittest tests.test_jobs_cancel_commit_boundary -v
          python -m unittest tests.test_ass_export_sampling_scale -v
      - name: Upload FFmpeg/libass pixel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsr-ass-libass-frames-${{ github.run_id }}
          path: artifacts/subtitle-libass/
          if-no-files-found: warn
          retention-days: 14
