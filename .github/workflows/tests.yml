name: tests

on:
  push:
    branches: [main, "v0.*"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q app tests
      - name: Import web server
        run: python -c "import app.server"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run pytest tests
        run: python -m pytest -q tests/test_gpt_sovits_export.py

  termux-lite-surface:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Create clean lightweight environment
        run: python -m venv .venv-termux
      - name: Install only Termux Python requirements
        run: .venv-termux/bin/python -m pip install -r requirements-termux.txt
      - name: Compile lite server path
        run: .venv-termux/bin/python -m compileall -q app
      - name: Prove lite server imports without FastAPI or Pydantic
        run: |
          .venv-termux/bin/python - <<'PY'
          import importlib.util
          for name in ("fastapi", "uvicorn", "pydantic", "pydantic_core", "openai", "py7zr"):
              assert importlib.util.find_spec(name) is None, name
          import app.lite_server
          print("Termux lite dependency surface: OK")
          PY

  real-libass-ink-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install actual renderer and fonts
        run: |
          # Ubuntu runners may already provide FFmpeg/libass and DejaVu.
          # Avoid unconditional apt-get update (it can block real ink CI for
          # minutes) unless actual media/font prerequisites are missing.
          if ! command -v ffmpeg >/dev/null 2>&1 || \
             ! ffmpeg -hide_banner -filters 2>/dev/null | grep -Eq ' subtitles | ass ' || \
             ! command -v fc-match >/dev/null 2>&1 || \
             ! fc-match "DejaVu Sans" >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fontconfig
          fi
          ffmpeg -hide_banner -filters | grep -E ' subtitles | ass '
          fc-match "DejaVu Sans"
      - name: Install minimal test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Validate real rendered ink evidence
        run: python -m unittest tests.test_libass_ink_layout -v
