name: HSR sustained concurrent job journal regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sustained-job-journal:
    name: sustained progress and abort (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Sustained interprocess progression and abrupt-kill regression
        run: python -m unittest tests.test_job_journal_sustained_progress -v
