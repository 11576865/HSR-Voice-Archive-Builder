name: HSR seven ASS requirements

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seven-ass-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install real libass, FFmpeg and fonts
        run: |
          # GitHub-hosted Ubuntu commonly ships usable FFmpeg/libass and
          # DejaVu already. Avoid an unconditional apt index update (which
          # can stall the entire media acceptance suite on mirror latency).
          # Fall back to apt only if the actual renderer/font prerequisite
          # is missing. The strict real-mux tests below still run in full.
          if ! command -v ffmpeg >/dev/null 2>&1 || \
             ! ffmpeg -hide_banner -filters 2>/dev/null | grep -Eq ' subtitles | ass ' || \
             ! command -v fc-match >/dev/null 2>&1 || \
             ! fc-match "DejaVu Sans" >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fontconfig
          fi
          python -m pip install -r requirements-test.txt
          ffmpeg -hide_banner -filters | grep -E ' subtitles | ass '
          fc-match "DejaVu Sans"
      - name: Compile production and regression code
        run: |
          python -m compileall -q app subtitle_layout tests
          python -c "import app.server; import app.lite_server"
      - name: Verify seven ASS delivery contracts with actual MKV mux/demux
        run: |
          python -m unittest -v \
            tests.test_ass_export_progress \
            tests.test_ass_export_phase_boundary \
            tests.test_ass_export_writer_reservation \
            tests.test_ass_to_mkv_regeneration_contract \
            tests.test_subtitle_voice_only_display \
            tests.test_subtitle_fade_budget \
            tests.test_subtitle_timing_overrides \
            tests.test_archive_bundle_lifecycle \
            tests.test_archive_bundle_exporter
