name: UIGS Intake Adapter

on:
  workflow_run:
    workflows: ["tests"]
    types: [completed]
  workflow_dispatch:
    inputs:
      record_type:
        description: Pending record type
        required: true
        default: observation
        type: choice
        options:
          - observation
          - candidate
          - bug
          - case
          - test
          - lesson
      title:
        description: Short title
        required: true
        type: string
      summary:
        description: Evidence summary
        required: true
        type: string
      dedupe_key:
        description: Optional stable dedupe key
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: uigs-intake-${{ github.repository }}
  cancel-in-progress: false

jobs:
  emit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out' ||
      github.event.workflow_run.conclusion == 'action_required' ||
      github.event.workflow_run.conclusion == 'startup_failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Build UIGS intake packet
        id: packet
        env:
          EVENT_NAME: ${{ github.event_name }}
          ADAPTER_RUN_ID: ${{ github.run_id }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_ID: ${{ github.event.workflow_run.id }}
          WR_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
          INPUT_TYPE: ${{ inputs.record_type }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_SUMMARY: ${{ inputs.summary }}
          INPUT_DEDUPE: ${{ inputs.dedupe_key }}
        run: |
          python - <<'PY'
          import json, os, re
          from datetime import datetime, timezone
          from pathlib import Path

          manifest = json.loads(Path(".uigs/project.json").read_text(encoding="utf-8"))
          repo = os.environ["SOURCE_REPOSITORY"]
          slug = re.sub(r"[^A-Za-z0-9._-]+", "-", repo).strip("-")
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          event = os.environ["EVENT_NAME"]

          if event == "workflow_run":
              run_id = os.environ.get("WR_ID", "").strip()
              attempt = os.environ.get("WR_ATTEMPT", "1").strip() or "1"
              packet_id = f"ci-{slug}-{run_id}-{attempt}"
              conclusion = os.environ.get("WR_CONCLUSION", "unknown").strip()
              workflow = os.environ.get("WR_NAME", "workflow").strip()
              packet = {
                  "packet_version": 1,
                  "packet_id": packet_id,
                  "status": "pending",
                  "record_type": "ci_failure",
                  "title": f"{workflow}: {conclusion}",
                  "summary": "Tracked CI workflow did not complete successfully. Triage the Red Reason and decide whether this is reusable failure knowledge.",
                  "source_repository": repo,
                  "source_event": "workflow_run",
                  "source_ref": os.environ.get("WR_HEAD_BRANCH", ""),
                  "source_sha": os.environ.get("WR_HEAD_SHA", ""),
                  "source_url": os.environ.get("WR_URL", ""),
                  "created_at": now,
                  "dedupe_key": f"workflow_run:{repo}:{run_id}:{attempt}",
                  "routing_hints": sorted(set(manifest.get("routing_hints", []) + ["reliability", "red-reason"])),
                  "evidence": {
                      "workflow": workflow,
                      "run_id": run_id,
                      "run_attempt": attempt,
                      "conclusion": conclusion,
                      "trigger_event": os.environ.get("WR_EVENT", "")
                  }
              }
          else:
              adapter_run = os.environ.get("ADAPTER_RUN_ID", "").strip()
              packet_id = f"manual-{slug}-{adapter_run}"
              dedupe = os.environ.get("INPUT_DEDUPE", "").strip() or f"manual:{repo}:{adapter_run}"
              packet = {
                  "packet_version": 1,
                  "packet_id": packet_id,
                  "status": "pending",
                  "record_type": os.environ.get("INPUT_TYPE", "observation").strip() or "observation",
                  "title": os.environ.get("INPUT_TITLE", "").strip(),
                  "summary": os.environ.get("INPUT_SUMMARY", "").strip(),
                  "source_repository": repo,
                  "source_event": "workflow_dispatch",
                  "source_ref": os.environ.get("SOURCE_REF", ""),
                  "source_sha": os.environ.get("SOURCE_SHA", ""),
                  "source_url": f"https://github.com/{repo}/actions/runs/{adapter_run}",
                  "created_at": now,
                  "dedupe_key": dedupe,
                  "routing_hints": manifest.get("routing_hints", []),
                  "evidence": {"adapter_run_id": adapter_run}
              }

          out = Path("/tmp/uigs-packet.json")
          out.write_text(json.dumps(packet, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as f:
              f.write(f"packet_id={packet['packet_id']}\n")
          print(json.dumps(packet, ensure_ascii=False, indent=2))
          PY

      - name: Persist packet to durable outbox branch
        env:
          PACKET_ID: ${{ steps.packet.outputs.packet_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/uigs-packet.json
          git config user.name "uigs-intake-bot"
          git config user.email "uigs-intake-bot@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin uigs-outbox >/dev/null 2>&1; then
            git fetch origin refs/heads/uigs-outbox:refs/remotes/origin/uigs-outbox
            git switch --force-create uigs-outbox origin/uigs-outbox
          else
            git switch --orphan uigs-outbox
            git rm -rf . >/dev/null 2>&1 || true
            printf '%s\n' '# UIGS durable outbox' '' 'Generated intake packets. Do not use this branch as product source.' > README.md
          fi

          mkdir -p packets
          target="packets/${PACKET_ID}.json"
          if [[ -e "$target" ]]; then
            if cmp -s /tmp/uigs-packet.json "$target"; then
              echo "Packet already exists unchanged: $target"
              exit 0
            fi
            echo "::error::Packet id collision with different content: $target"
            exit 1
          fi

          cp /tmp/uigs-packet.json "$target"
          git add README.md packets
          git commit -m "chore(uigs): queue ${PACKET_ID}"
          git push origin HEAD:uigs-outbox
