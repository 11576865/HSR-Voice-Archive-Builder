<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSR Voice Archive Builder</title>
<style>
body{font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;max-width:900px;margin:40px auto;padding:0 20px;background:#f7f7f8;color:#18181b}main{background:white;padding:24px;border:1px solid #ddd;border-radius:12px}label{display:block;margin:14px 0 6px;font-weight:600}input{box-sizing:border-box;width:100%;padding:10px;border:1px solid #bbb;border-radius:7px}button{margin-top:20px;padding:10px 18px;border:0;border-radius:8px;background:#222;color:white;cursor:pointer}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}.check{display:flex;align-items:center;gap:8px;margin-top:16px}.check input{width:auto}pre{white-space:pre-wrap;background:#111;color:#eee;padding:14px;border-radius:8px;min-height:80px}.hint{color:#666;font-size:.92rem}.optional{font-weight:400;color:#777}
</style></head>
<body><main>
<h1>HSR Voice Archive Builder <small>v0.2</small></h1>
<p class="hint">浏览器只是本地控制面板。音频、LAB、CSV、翻译回写和 FFmpeg 全部由本机后端处理。</p>
<form id="f">
<label>顺序索引 CSV</label><input name="index_csv" required placeholder="D:\HSR\index.csv">
<label>双语索引 CSV <span class="optional">（可选）</span></label><input name="bilingual_csv" placeholder="D:\HSR\bilingual.csv">
<label>中文 LAB 来源 <span class="optional">（目录 / ZIP / 7z，可选）</span></label><input name="chs_source" placeholder="D:\HSR\Chinese.7z">
<label>英文 WAV 来源（目录 / ZIP / 7z）</label><input name="wav_source" required placeholder="D:\HSR\English-WAV.zip">
<label>输出目录</label><input name="output_dir" required placeholder="D:\HSR\output">
<div class="row"><div><label>同组间隔（秒）</label><input name="same_gap" type="number" step="0.01" value="0.40"></div><div><label>组间间隔（秒）</label><input name="group_gap" type="number" step="0.01" value="1.20"></div></div>
<label class="check"><input name="make_flac" type="checkbox" value="true"> 生成并校验连续 FLAC</label>
<label class="check"><input name="translate_missing" type="checkbox" value="true"> 用 GPT 翻译仍然缺失的中文</label>
<div class="row"><div><label>翻译模型</label><input name="translation_model" value="gpt-5.6-luna"></div><div><label>翻译批大小</label><input name="translation_batch_size" type="number" min="1" value="80"></div></div>
<p class="hint">启用翻译时，API Key 只从后端环境变量 <code>OPENAI_API_KEY</code> 读取，不会写入项目文件或网页。</p>
<button type="submit">构建</button>
</form>
<h2>结果</h2><pre id="out">等待运行。</pre>
</main>
<script>
const f=document.getElementById('f'),out=document.getElementById('out');
f.addEventListener('submit',async e=>{e.preventDefault();out.textContent='处理中…';const fd=new FormData(f);for(const n of ['make_flac','translate_missing']){if(!f.elements[n].checked)fd.delete(n)}try{const r=await fetch('/build',{method:'POST',body:fd});const j=await r.json();out.textContent=JSON.stringify(j,null,2)}catch(err){out.textContent=String(err)}})
</script></body></html>
